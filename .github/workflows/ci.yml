# GitHub Actions CI for lume-showcase.
# Builds erishen/lume-core (public repo) from source; runs lume-core gates +
# showcase 3-backend smoke + frontend build + Docker image build.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lume-showcase

      - uses: actions/checkout@v4
        with:
          repository: erishen/lume-core
          path: lume-core

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev pkg-config clang llvm

      - name: build lume-core
        working-directory: lume-core
        run: make -j"$(nproc)"

      - name: lume-core gates
        working-directory: lume-core
        run: make lib-backends lib-compat

      - name: showcase smoke (interp + text backend, byte-identical)
        working-directory: lume-showcase
        run: bash tests/smoke.sh

      - name: frontend build
        working-directory: lume-showcase/web
        run: |
          npm ci --no-audit --no-fund --include=optional
          npm run build

      - name: docker image build
        run: |
          # context is the checkout root (lume-showcase + lume-core siblings) · slim the context
          printf '/lume-showcase/.git/\n/lume-showcase/web/node_modules/\n/lume-showcase/web/dist/\n/lume-core/.git/\n/lume-core/build/\n/lume-core/bin/\n' > .dockerignore
          docker build -f lume-showcase/Dockerfile -t lume-showcase .
